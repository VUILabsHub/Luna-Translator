<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">社区版运行架构</title>
<desc id="desc">Web 浏览器 → 同源入口 → Go 社区后端; Luna 同传 API, 百炼 ASR, 百炼 Embedding, 持久化数据卷.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5c8069"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans SC',sans-serif}.node-title{fill:#173e2a;font-size:17px;font-weight:600;text-anchor:middle}.node-subtitle{fill:#4e6457;font-size:13px;text-anchor:middle}.edge{fill:none;stroke:#5c8069;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="420" rx="18" fill="#f4f8f5"/>
<text x="30" y="42" fill="#173e2a" font-size="20" font-weight="600">社区版运行架构</text>
<text x="30" y="68" fill="#4e6457" font-size="13">应用调用外部 API；模型本身不分发</text>
<path class="edge" d="M220 184H270"/><path class="edge" d="M470 184H520"/>
<path class="edge" d="M750 184H790V65H830"/><path class="edge" d="M790 184V175H830"/><path class="edge" d="M790 184V285H830"/>
<path class="edge" d="M635 234V320"/>
<g><rect x="30" y="134" width="190" height="100" rx="14" fill="#ffffff" stroke="#b7cbbd"/><text x="125.0" y="179.0" class="node-title">Web 浏览器</text><text x="125.0" y="204.0" class="node-subtitle">音频输入 · 字幕 · 播放</text></g><g><rect x="270" y="134" width="200" height="100" rx="14" fill="#ffffff" stroke="#b7cbbd"/><text x="370.0" y="179.0" class="node-title">同源入口</text><text x="370.0" y="204.0" class="node-subtitle">Nginx · HTTP / WebSocket</text></g><g><rect x="520" y="134" width="230" height="100" rx="14" fill="#ffffff" stroke="#b7cbbd"/><text x="635.0" y="179.0" class="node-title">Go 社区后端</text><text x="635.0" y="204.0" class="node-subtitle">工作区鉴权 · 会话 · 产品 API</text></g><g><rect x="830" y="20" width="260" height="90" rx="14" fill="#ffffff" stroke="#b7cbbd"/><text x="960.0" y="60.0" class="node-title">Luna 同传 API</text><text x="960.0" y="85.0" class="node-subtitle">实时译文与译音</text></g><g><rect x="830" y="130" width="260" height="90" rx="14" fill="#ffffff" stroke="#b7cbbd"/><text x="960.0" y="170.0" class="node-title">百炼 ASR</text><text x="960.0" y="195.0" class="node-subtitle">可选 · 原文转写</text></g><g><rect x="830" y="240" width="260" height="90" rx="14" fill="#ffffff" stroke="#b7cbbd"/><text x="960.0" y="280.0" class="node-title">百炼 Embedding</text><text x="960.0" y="305.0" class="node-subtitle">可选 · 向量评分 API</text></g><g><rect x="530" y="320" width="210" height="72" rx="14" fill="#ffffff" stroke="#b7cbbd"/><text x="635.0" y="351.0" class="node-title">持久化数据卷</text><text x="635.0" y="376.0" class="node-subtitle">历史 · 音频 · 分享快照</text></g>
</svg>
