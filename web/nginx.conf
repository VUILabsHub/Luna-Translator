server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 8m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_read_timeout 240s;
  }
  location /ws/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 2100s;
    proxy_send_timeout 2100s;
    proxy_buffering off;
  }
  location = /health { proxy_pass http://backend:8080/health; }
  location = /ready { proxy_pass http://backend:8080/ready; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location /welcome/ { try_files $uri $uri/ =404; }
  location / { try_files $uri $uri/ /index.html; }
}
